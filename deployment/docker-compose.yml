version: '3.8'

services:
  # ----------------------------------------------------------------
  # INFRASTRUCTURE
  # ----------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    # ports:
    #   - "127.0.0.1:27017:27017" # Exposed ONLY to localhost for safety (or comment out completely)
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    # ports:
    #   - "5673:5672"   # AMQP (Internal only)
    #   - "15673:15672" # Management UI (Tunnel via SSH to access)
    networks:
      - app-network

  # ----------------------------------------------------------------
  # BACKEND SERVICES
  # ----------------------------------------------------------------
  backend-api:
    build:
      context: ../
      dockerfile: deployment/Dockerfile.backend
    restart: always
    command: ["/app/api"]
    expose:
      - "8080"
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://root:password@mongodb:27017
      - MONGODB_DATABASE=social_feed
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - APP_PORT=8080
      - API_MODE=release
      - LOGGER_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - ENCRYPT_KEY=${ENCRYPT_KEY:-changemechangemechangemechangeme} # Must be 32 bytes
      # API Keys (Provide these in .env file)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - BSCSCAN_API_KEY=${BSCSCAN_API_KEY}
      - BASESCAN_API_KEY=${BASESCAN_API_KEY}
      - ARBITRUMSCAN_API_KEY=${ARBITRUMSCAN_API_KEY}
      - POLYGONSCAN_API_KEY=${POLYGONSCAN_API_KEY}
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - app-network

  backend-worker:
    build:
      context: ../
      dockerfile: deployment/Dockerfile.backend
    restart: always
    command: ["/app/worker"]
    environment:
      - MONGODB_URI=mongodb://root:password@mongodb:27017
      - MONGODB_DATABASE=social_feed
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - LOGGER_LEVEL=info
      - ENCRYPT_KEY=${ENCRYPT_KEY:-changemechangemechangemechangeme}
      - BOT_USER_ID=${BOT_USER_ID}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # API Keys
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - app-network

  # ----------------------------------------------------------------
  # FRONTEND
  # ----------------------------------------------------------------
  frontend:
    build:
      context: ../
      dockerfile: deployment/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://cryptocheck.click}
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080 # Client-side URL (needs public domain in prod)
      # Note: For Server Components to talk to backend container internally:
      # - INTERNAL_API_URL=http://backend-api:8080
    depends_on:
      - backend-api
    networks:
      - app-network

  # ----------------------------------------------------------------
  # HTTPS / SSL PROXY (Caddy)
  # ----------------------------------------------------------------
  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend-api
    networks:
      - app-network

volumes:
  mongodb_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
